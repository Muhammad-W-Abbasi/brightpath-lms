name: Keep Render Warm

on:
  schedule:
    # GitHub Actions cron uses UTC and does not shift for daylight saving time.
    # This targets about 7:00 AM-10:50 PM Winnipeg time during daylight time (CDT, UTC-5).
    # During standard time (CST, UTC-6), it runs about 6:00 AM-9:50 PM Winnipeg time.
    - cron: "*/10 0-3,12-23 * * *"
  workflow_dispatch:

jobs:
  ping-render:
    name: Ping Render health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping /actuator/health
        shell: bash
        run: |
          url="https://brightpath-lms.onrender.com/actuator/health"

          status_code="$(curl \
            --silent \
            --show-error \
            --location \
            --output response.txt \
            --write-out "%{http_code}" \
            --max-time 70 \
            "$url" || true)"

          echo "Render health endpoint: $url"
          echo "HTTP status code: $status_code"

          if [[ ! "$status_code" =~ ^[0-9]{3}$ ]] || (( status_code < 200 || status_code >= 400 )); then
            echo "Unexpected response from Render health endpoint."
            exit 1
          fi
